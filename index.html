<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Solar System</title>
<meta name="description" content="The Solar System (10¹³ m): the Sun's neighborhood · 9 billion km across at Neptune · real orbits and real speeds, distances squeezed to fit. Explained simply by an AI narrator, with captions. One of nine scales, from the nucleus to the universe.">
<meta name="theme-color" content="#03050b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef4ff;--dim:rgba(214,228,255,.66);--acc:#8fc2ff}
html,body{margin:0;height:100%;background:#03050b;overflow:hidden;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px;background:linear-gradient(rgba(3,5,11,.72),rgba(3,5,11,.3) 65%,transparent)}
.k{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.38em;color:var(--dim);text-transform:uppercase}
.k b{color:var(--acc);font-weight:600}
.name{font-weight:700;font-size:clamp(30px,6.2vw,76px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;margin:.18em 0 .12em;color:#fff;text-shadow:0 0 28px rgba(110,165,255,.7),0 0 6px rgba(160,200,255,.55),0 2px 14px rgba(0,0,0,.9);animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
#cc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);width:max-content;max-width:min(92vw,820px);text-align:center;pointer-events:none}
#cc span{display:inline-block;font:500 clamp(16px,2.2vw,25px)/1.4 "Space Grotesk",system-ui,sans-serif;color:#fff;background:rgba(3,6,14,.74);padding:.34em .8em;border-radius:10px;box-shadow:0 0 0 1px rgba(143,194,255,.22),0 8px 30px rgba(0,0,0,.5)}
#cc span:empty{display:none}
#snd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 132px);font:600 clamp(12px,1.5vw,15px)/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#03050b;background:linear-gradient(180deg,#d7e9ff,#8fc2ff);padding:.8em 1.2em;border-radius:999px;box-shadow:0 0 30px rgba(143,194,255,.6);cursor:pointer;user-select:none;-webkit-user-select:none;animation:pulse 1.6s ease-in-out infinite;white-space:nowrap}
#snd.on{left:auto;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));bottom:auto;transform:none;animation:none;background:rgba(3,6,14,.7);color:var(--acc);box-shadow:0 0 0 1px rgba(143,194,255,.4);font-size:11px;padding:.7em 1em}
@keyframes pulse{50%{box-shadow:0 0 54px rgba(143,194,255,.95)}}
#ruler{position:fixed;left:max(52px,env(safe-area-inset-left));right:max(52px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));height:56px}
#ruler:before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(143,194,255,.55) 6%,rgba(143,194,255,.55) 94%,transparent)}
#ruler a{position:absolute;top:0;transform:translateX(-50%);text-decoration:none;color:var(--dim);font:400 10px/1.25 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;text-align:center;white-space:nowrap;padding-top:30px;outline:none}
#ruler a:before{content:"";position:absolute;left:50%;top:15px;width:9px;height:9px;margin-left:-5px;border-radius:50%;background:#0b1326;box-shadow:0 0 0 1.5px rgba(143,194,255,.75);transition:transform .2s,background .2s}
#ruler a:hover,#ruler a:focus-visible{color:#fff}
#ruler a:hover:before,#ruler a:focus-visible:before{transform:scale(1.5);background:var(--acc)}
#ruler a.up{padding-top:0;top:-14px}
#ruler a.up:before{top:29px}
#ruler a.me{color:#fff;font-weight:600}
#ruler a.me:before{background:#fff;box-shadow:0 0 0 2px var(--acc),0 0 18px 4px rgba(143,194,255,.9);transform:scale(1.35)}
#ruler a b{display:block;font-weight:600;color:var(--acc)}
#ruler .cap{position:absolute;top:-30px;font:400 10px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(214,228,255,.4)}
#ruler .cap.l{left:-30px}#ruler .cap.r{right:-30px}
@media (max-width:760px){#ruler a:not(.me) span{display:none}#ruler a:not(.me) b{font-size:9px}#ruler .cap{display:none}#cc{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px)}}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:rgba(214,228,255,.7);font:400 10px/1.25 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:14px 8px;outline:none;text-shadow:0 0 8px #000}
.nav i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(3,6,14,.62);box-shadow:0 0 0 1.5px rgba(143,194,255,.55);font:300 28px/1 system-ui,sans-serif;font-style:normal;color:#fff;padding-bottom:3px;box-sizing:border-box;transition:transform .2s,box-shadow .2s,background .2s}
.nav:hover i,.nav:focus-visible i{transform:scale(1.12);background:rgba(143,194,255,.25);box-shadow:0 0 0 2px #8fc2ff,0 0 24px rgba(143,194,255,.75)}
.nav.l{left:max(6px,env(safe-area-inset-left))}
.nav.r{right:max(6px,env(safe-area-inset-right))}
.nav b{display:block;color:#8fc2ff;font-weight:600}
@media (max-width:760px){.nav span{display:none}.nav i{width:40px;height:40px;font-size:23px}}
@media (prefers-reduced-motion:reduce){.name,#snd{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="k" id="k"></div>
  <h1 class="name" id="name"></h1>
  <div class="sub" id="sub"></div>
</div>
<div id="cc" aria-live="polite"><span id="cap"></span></div>
<div id="snd" role="button" tabindex="0" aria-label="Turn the narration sound on">&#128266; Tap anywhere to hear it explained</div>
<nav id="ruler" aria-label="The nine scales, from the nucleus to the universe"></nav>
<audio id="au" src="./narration.mp3" preload="auto" loop muted autoplay playsinline></audio>
<script>
(function () {
'use strict';
// One of nine pages, one per scale of the world (10^-15 m to 10^27 m). Each draws its scale from the real numbers and
// an AI voice explains it; the captions are cut from the voice's own timing. The ruler at the bottom links the nine.
var D = {"i":6,"scales":[{"exp":-15,"name":"The Nucleus","short":"nucleus","size":"10⁻¹⁵ m","sub":"the heart of an atom · a millionth of a billionth of a meter · uranium-235: 92 protons, 143 neutrons","domain":"doseofdestruction.com"},{"exp":-10,"name":"The Atom","short":"atom","size":"10⁻¹⁰ m","sub":"the building brick of everything · one ten-billionth of a meter · hydrogen's electron clouds, drawn from the real equations","domain":"hawkesgames.com"},{"exp":-5,"name":"The Cell","short":"cell","size":"10⁻⁵ m","sub":"the smallest living thing · a hundredth of a millimeter · you are about 37 trillion of these","domain":"hawkesbiomedical.com"},{"exp":0,"name":"You","short":"you","size":"10⁰ m","sub":"the human scale · about a meter and a bit · 7 × 10²⁷ atoms, 37 trillion cells, 86 billion neurons","domain":"icanbe.ai"},{"exp":7,"name":"The Planet","short":"planet","size":"10⁷ m","sub":"Earth · 12,742 km across · a thin skin of rock and air around a ball of hot stone and metal","domain":"yoobalandgame.com"},{"exp":9,"name":"The Star","short":"star","size":"10⁹ m","sub":"the Sun · 1.39 million km across · a million Earths would fit inside","domain":"imaginelivetv.com"},{"exp":13,"name":"The Solar System","short":"solar system","size":"10¹³ m","sub":"the Sun's neighborhood · 9 billion km across at Neptune · real orbits and real speeds, distances squeezed to fit","domain":"theplacedepartment.com"},{"exp":21,"name":"The Galaxy","short":"galaxy","size":"10²¹ m","sub":"","domain":"phorigins.com"},{"exp":27,"name":"The Universe","short":"universe","size":"10²⁷ m","sub":"everything we could ever see · 93 billion light-years across · 13.8 billion years old","domain":"hawkesgen.ai"}],"cues":[[0,0.64,"Hi."],[0.64,2.61,"I'm the AI that lives in this page."],[2.61,4.17,"Welcome to the neighborhood."],[4.17,7.73,"In the middle is the Sun, and every planet has its own address."],[7.73,11.18,"A path it follows, around and around, called an orbit."],[11.18,13.05,"The close planets race."],[13.05,15.63,"Mercury zips around in eighty-eight days."],[15.63,17.01,"The far ones crawl."],[17.01,19.47,"Neptune takes a hundred and sixty-five years,"],[19.47,21.89,"so nobody could ever have a second birthday there."],[21.89,23.34,"Why don't they fly away?"],[23.34,26.7,"The Sun's gravity holds them, like a ball on a string."],[26.7,29.71,"The closer the planet, the faster it has to go."],[29.71,32.88,"That is the one rule every planet obeys."],[32.88,34.3,"How big is it all?"],[34.3,36.05,"If the Sun were a front door,"],[36.05,38.99,"the Earth would be a nickel, two soccer fields away."],[38.99,42.25,"And Neptune would be a baseball, four miles down the road."],[43.2,46.13,"I had to squeeze the map to fit it on your screen."],[46.13,49.419999999999995,"Space is mostly, well, space."]],"dur":49.42};
var TAU = Math.PI * 2;
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r) { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
// a soft glowing dot, drawn from a cached sprite (fast enough for tens of thousands a frame)
var sprites = {};
function sprite(col) {
  if (sprites[col]) return sprites[col];
  var s = document.createElement('canvas'); s.width = s.height = 64; var g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, col); gr.addColorStop(0.25, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.globalAlpha = 1; g.fillRect(0, 0, 64, 64);
  return (sprites[col] = s);
}
function dot(x, c, y, r, col, a) { x.globalAlpha = a == null ? 1 : a; x.drawImage(sprite(col), c - r, y - r, r * 2, r * 2); }
function label(x, text, px, py, align, col, size) {
  x.save(); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.font = '500 ' + (size || 12) + 'px "JetBrains Mono", ui-monospace, monospace'; x.textAlign = align || 'left'; x.textBaseline = 'middle';
  x.lineWidth = 4; x.strokeStyle = 'rgba(3,5,11,.85)'; x.strokeText(text, px, py); x.fillStyle = col || 'rgba(214,228,255,.9)'; x.fillText(text, px, py); x.restore();
}
function lead(x, x0, y0, x1, y1, col) { x.save(); x.globalAlpha = 0.6; x.globalCompositeOperation = 'source-over'; x.strokeStyle = col || 'rgba(143,194,255,.7)'; x.lineWidth = 1; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function scaleBar(x, W, H, px, text) { // a labelled length, bottom-left above the ruler
  var bx = Math.max(22, W * 0.03), by = H - 150; x.save(); x.globalAlpha = 0.9; x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(bx, by - 5); x.lineTo(bx, by); x.lineTo(bx + px, by); x.lineTo(bx + px, by - 5); x.stroke(); x.restore();
  label(x, text, bx, by + 14, 'left', 'rgba(238,244,255,.92)', 12);
}
var H3 = { rng: rng, gauss: gauss, clamp: clamp, lerp: lerp, smooth: smooth, dot: dot, label: label, lead: lead, scaleBar: scaleBar, TAU: TAU };

// THE SOLAR SYSTEM: the eight planets on their real orbits. Each position comes from Kepler's equation
// (M = E - e sin E, solved each frame) with the planet's real eccentricity and period, so every planet sweeps equal
// areas in equal times and obeys T^2 = a^3 (T in years, a in AU). One second here is 36.5 days.
// Only the map is squeezed: distance from the Sun is drawn as its square root, or Neptune (30 AU) would push Mercury
// (0.39 AU) into the Sun. Sizes are symbols. A comet (Encke: e = 0.85, 3.3 years) shows a stretched orbit.
var SCENE = (function () {
  var r = H3.rng(12), belt = [], stars = [];
  var PL = [ // name, a (AU), e, period (years), colour, symbol size, argument of perihelion, start phase
    ['Mercury', 0.387, 0.2056, 0.2408, '#b9b3aa', 2.6, 0.5, 0.3], ['Venus', 0.723, 0.0068, 0.6152, '#f2d6a0', 3.6, 2.3, 2.1], ['Earth', 1, 0.0167, 1, '#5aa8ff', 3.8, 1.8, 4.2], ['Mars', 1.524, 0.0934, 1.8808, '#e2714a', 3.1, 5, 1.1],
    ['Jupiter', 5.203, 0.0489, 11.862, '#e8c79a', 8, 0.25, 3.3], ['Saturn', 9.537, 0.0565, 29.457, '#ecdca8', 7, 1.6, 5.4], ['Uranus', 19.19, 0.0472, 84.02, '#a8e6ea', 5.4, 1.7, 0.9], ['Neptune', 30.07, 0.0086, 164.8, '#6f8cff', 5.2, 0.8, 2.6]];
  function kepler(M, e) { var E = M; for (var i = 0; i < 12; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); return E; }
  function place(a, e, M, w) { var E = kepler(M, e), nu = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2)), rr = a * (1 - e * Math.cos(E)); return [rr, nu + w]; }
  function init() { var i; for (i = 0; i < 900; i++) belt.push({ a: 2.15 + r() * 1.15, ph: r() * 6.2832, e: r() * 0.15, w: r() * 6.28 }); for (i = 0; i < 300; i++) stars.push([r(), r(), 0.3 + r() * 1.1]); }
  function draw(x, W, H, t, dt, nt) {
    var cx = W / 2, cy = H * 0.47, K = Math.min(W * 0.46, H * 0.62) / Math.sqrt(31), tilt = W > H ? 0.46 : 0.72, yr = t / 10, i;
    function XY(rr, ang) { var d = Math.sqrt(rr) * K; return [cx + Math.cos(ang) * d, cy + Math.sin(ang) * d * tilt]; }
    x.fillStyle = '#02030a'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter'; for (i = 0; i < stars.length; i++) H3.dot(x, stars[i][0] * W, stars[i][1] * H, stars[i][2], 'rgba(220,230,255,1)', 0.45);
    // the orbits (each planet's address)
    x.globalCompositeOperation = 'source-over';
    for (i = 0; i < PL.length; i++) { var p = PL[i]; x.beginPath(); for (var k = 0; k <= 180; k++) { var q = place(p[1], p[2], k / 180 * 6.2832, p[6]), s = XY(q[0], q[1]); x.lineTo(s[0], s[1]); } x.closePath(); x.strokeStyle = 'rgba(143,194,255,' + (i < 4 ? 0.34 : 0.26) + ')'; x.lineWidth = 1; x.stroke(); }
    // the asteroid belt, each rock on its own Kepler orbit
    x.globalCompositeOperation = 'lighter';
    for (i = 0; i < belt.length; i++) { var b = belt[i], bq = place(b.a, b.e, b.ph + yr * 6.2832 / Math.pow(b.a, 1.5), b.w), bs = XY(bq[0], bq[1]); H3.dot(x, bs[0], bs[1], 1.2, 'rgba(200,190,170,1)', 0.5); }
    // the Sun
    H3.dot(x, cx, cy, K * 0.85, 'rgba(255,170,60,1)', 0.35); H3.dot(x, cx, cy, K * 0.36, 'rgba(255,230,160,1)', 1); H3.dot(x, cx, cy, K * 0.17, 'rgba(255,255,255,1)', 1);
    // the comet, its tail always pointing away from the Sun
    var cq = place(2.215, 0.848, yr * 6.2832 / 3.3 + 1, 3.2), cs = XY(cq[0], cq[1]), away = Math.atan2(cs[1] - cy, cs[0] - cx), tl = H3.clamp(1.6 / cq[0], 0.15, 2.2) * K * 0.9;
    x.globalCompositeOperation = 'source-over'; x.beginPath(); for (var kk = 0; kk <= 120; kk++) { var c2 = place(2.215, 0.848, kk / 120 * 6.2832, 3.2), c3 = XY(c2[0], c2[1]); x.lineTo(c3[0], c3[1]); } x.closePath(); x.strokeStyle = 'rgba(190,255,240,.16)'; x.setLineDash([3, 6]); x.stroke(); x.setLineDash([]);
    x.globalCompositeOperation = 'lighter'; for (i = 0; i < 26; i++) H3.dot(x, cs[0] + Math.cos(away) * tl * i / 26, cs[1] + Math.sin(away) * tl * i / 26, 5 - i * 0.14, 'rgba(180,255,240,1)', 0.55 * (1 - i / 26)); H3.dot(x, cs[0], cs[1], 4, 'rgba(255,255,255,1)', 1);
    // the planets
    var lab = [];
    for (i = 0; i < PL.length; i++) { var pl = PL[i], pq = place(pl[1], pl[2], pl[7] + yr * 6.2832 / pl[3], pl[6]), ps = XY(pq[0], pq[1]), sz = pl[5] * Math.max(1, K / 34);
      H3.dot(x, ps[0], ps[1], sz * 2.6, pl[4].replace('#', '#') , 0.25); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.fillStyle = pl[4]; x.beginPath(); x.arc(ps[0], ps[1], sz, 0, 7); x.fill();
      if (pl[0] === 'Saturn') { x.strokeStyle = 'rgba(236,220,168,.85)'; x.lineWidth = 1.6; x.beginPath(); x.ellipse(ps[0], ps[1], sz * 2.1, sz * 0.7, -0.35, 0, 7); x.stroke(); }
      x.globalCompositeOperation = 'lighter'; lab.push([pl, ps, sz]); }
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
    var small = W < 760;
    for (i = 0; i < lab.length; i++) { var L = lab[i], per = L[0][3] < 1 ? Math.round(L[0][3] * 365.25) + ' days' : L[0][3] < 2 ? (L[0][0] === 'Earth' ? '1 year' : L[0][3].toFixed(1) + ' years') : Math.round(L[0][3]) + ' years';
      H3.label(x, small && i < 4 ? L[0][0] : L[0][0] + '  ' + per, L[1][0] + L[2] + 6, L[1][1] - L[2] - 4, 'left', 'rgba(238,244,255,.92)', small ? 10 : 11); }
    H3.label(x, 'the Sun', cx, cy + K * 0.5, 'center', '#ffe6a8', 11);
    H3.label(x, 'year ' + (yr + 1).toFixed(1), cx, cy - Math.sqrt(31) * K * tilt - 14, 'center', 'rgba(214,228,255,.8)', 12);
    var bx = Math.max(22, W * 0.03); H3.label(x, '1 second = 36.5 days  ·  T² = a³  ·  distance drawn as √distance', bx, H - 150, 'left', 'rgba(238,244,255,.9)', small ? 10 : 12);
  }
  return { init: init, draw: draw };
})();


// ---------------------------------------------------------------- page
var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); if (SCENE.resize) SCENE.resize(W, Hh); }
addEventListener('resize', fit);
var me = D.scales[D.i];
document.getElementById('k').innerHTML = 'Scale ' + (D.i + 1) + ' of ' + D.scales.length + ' · <b>' + me.size + '</b>';
document.getElementById('name').textContent = me.name;
document.getElementById('sub').textContent = me.sub;
var ruler = document.getElementById('ruler'), lo = D.scales[0].exp, hi = D.scales[D.scales.length - 1].exp;
ruler.innerHTML = '<span class="cap l">← smaller</span><span class="cap r">bigger →</span>' + D.scales.map(function (s, i) {
  return '<a href="https://' + s.domain + '/" class="' + (i === D.i ? 'me ' : '') + (i % 2 ? 'up' : '') + '" style="left:' + ((s.exp - lo) / (hi - lo) * 100).toFixed(2) + '%"' + (i === D.i ? ' aria-current="page"' : '') + ' title="' + s.name + ' · ' + s.size + ' · ' + s.domain + '"><b>' + s.size + '</b><span>' + s.short + '</span></a>';
}).join('');

// the arrows at the sides: one scale smaller, one scale bigger (they wrap round at the ends); the arrow keys do the same
(function () { var n = D.scales.length, pv = D.scales[(D.i - 1 + n) % n], nx = D.scales[(D.i + 1) % n];
  function nav(cls, s, arrow, word) { var a = document.createElement('a'); a.className = 'nav ' + cls; a.href = 'https://' + s.domain + '/'; a.title = word + ': ' + s.name + ' (' + s.size + ')'; a.setAttribute('aria-label', word + ': ' + s.name); a.innerHTML = '<i>' + arrow + '</i><span>' + word + '<b>' + s.short + '</b></span>'; document.body.appendChild(a); return a; }
  var L = nav('l', pv, '‹', D.i === 0 ? 'biggest' : 'smaller'), R = nav('r', nx, '›', D.i === n - 1 ? 'smallest' : 'bigger');
  addEventListener('keydown', function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === 'ArrowLeft') location.href = L.href; else if (e.key === 'ArrowRight') location.href = R.href; });
})();

// the voice: muted until the first tap (browsers require it); the captions and the picture follow its clock either way
