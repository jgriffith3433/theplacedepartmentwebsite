<html lang="en">
<head>

<title>The Solar System</title>
<meta name="description" content="The Solar System (10¹³ m): the Sun's neighborhood · 9 billion km across at Neptune · real orbits and real speeds, distances squeezed to fit. Explained simply by an AI narrator, with captions. Flip the page for its opposite: a visitor with no address. One of nine scales, from the nucleus to the universe.">

<meta name="color-scheme" content="dark">

<style>

.k{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.38em;color:var(--dim);text-transform:uppercase}
.k b{color:#8fc2ff;font-weight:600}

.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
:root{--acc:#8fc2ff}
body{perspective:2400px;background:#000}
#page{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform;background:#03050b;overflow:hidden}
#shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:40;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.05) 42%,rgba(255,255,255,.22) 52%,rgba(0,0,0,.65))}

#hud2{display:none;position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(16px,env(safe-area-inset-top)) 16px 26px;z-index:4}
.bk{font:400 12px/1 Georgia,"Times New Roman",serif;font-style:italic;letter-spacing:.06em;color:rgba(40,28,16,.7)}

.bsub{font:400 clamp(12px,1.35vw,15px)/1.5 Georgia,"Times New Roman",serif;font-style:italic;color:rgba(40,28,16,.75);max-width:860px;margin:0 auto}

body.flip .fronthide{display:none!important}

#c2{position:fixed;inset:0;width:100%;height:100%;display:none}

</style>

ound, called an orbit."],[11.18,13.05,"The close planets race."],[13.05,15.63,"Mercury zips around in eighty-eight days."],[15.63,17.01,"The far ones crawl."],[17.01,19.47,"Neptune takes a hundred and sixty-five years,"],[19.47,21.89,"so nobody could ever have a second birthday there."],[21.89,23.34,"Why don't they fly away?"],[23.34,26.7,"The Sun's gravity holds them, like a ball on a string."],[26.7,29.71,"The closer the planet, the faster it has to go."],[29.71,32.88,"That is the one rule every planet obeys."],[32.88,34.3,"How big is it all?"],[34.3,36.05,"If the Sun were a front door,"],[36.05,38.99,"the Earth would be a nickel, two soccer fields away."],[38.99,42.25,"And Neptune would be a baseball, four miles down the road."],[43.2,46.13,"I had to squeeze the map to fit it on your screen."],[46.13,49.419999999999995,"Space is mostly, well, space."]],"dur":49.42},{"name":"a visitor with no address","size":"passing through","sub":"ʻOumuamua, 2017 · an open path, not a closed one · once round the Sun, then gone for good","cues":[[0,1.46,"You turned the page."],[1.46,2.89,"I'm the other AI."],[2.89,4.46,"The one on the back."],[4.46,7.27,"In the solar system, everything has an address."],[7.27,8.79,"This is the opposite."],[8.79,11.51,"A visitor with no address at all."],[11.51,16.35,"In twenty seventeen, something long and strange fell in from the stars."],[16.35,18.54,"We named it Oumuamua."],[18.54,21.3,"It means a messenger from far away."],[21.3,25.39,"It dove toward the Sun, swung around it once, and left."],[25.39,30.73,"The planets go around and around forever, because the Sun holds on to them."],[30.73,33.85,"But the visitor was going too fast to be caught."],[33.85,35.62,"It will never come back."],[35.62,40.089999999999996,"It just keeps drifting, alone, between the stars."]],"dur":40.09}]};

// ---------------------------------------------------------------- the back: its opposite (drawn light on black, shown as ink on paper)
// THE OPPOSITE OF THE SOLAR SYSTEM: a visitor with no address. 1I/'Oumuamua (2017) on its real path: a hyperbola
// with eccentricity e = 1.20 and closest approach q = 0.255 AU (inside Mercury's orbit). Bound orbits have e < 1 and
// close on themselves; e > 1 is an open curve, so it passes once and never returns. Its position comes from
// Kepler's hyperbolic equation, M = e sinh H - H, and its speed from the vis-viva equation,
// v^2 = GM (2/r + 1/a): 87.7 km/s at closest approach, slowing toward 26.3 km/s as it leaves for good.
// The inner planets are on their real Kepler orbits, drawn to true scale (no squeezing here). 1 second = 25 days.
var SCENE2 = (function () {

    // the visitor itself: long and thin, tumbling end over end every 8 hours
