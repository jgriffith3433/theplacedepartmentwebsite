<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12100e" />
    <meta
      name="description"
      content="The Place is where things that should not exist are given an address."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>The Place Department</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,560;1,9..144,520&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site/marketing.css" />
  </head>
  <body data-page="home">
    <a class="skip" href="#content">Skip to content</a>

    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="./index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="1" fill="none" stroke="#e7d3b0" stroke-width="1.6" />
            <circle cx="15.2" cy="12" r="1.1" fill="#f0b36a" />
          </svg>
          The Place Department
        </a>
        <div class="nav-tools">
          <a class="nav-play" href="/Game/index.html">Play</a>
        </div>
      </div>
    </header>

    <main id="content">
      <section class="hero hero-omen" aria-label="Introduction">
        <div class="stage" aria-hidden="true">
          <div class="stage-shot" id="shotA"></div>
          <div class="stage-shot" id="shotB"></div>
          <div class="stage-vignette"></div>
        </div>
        <div class="hero-copy">
          <h1 class="display">The Place Department</h1>
          <p class="omen">It's where it's at.</p>
          <a class="play-btn" href="/Game/index.html">Play</a>
        </div>
      </section>
    </main>

    <!-- hawkes-footer: written by breakingthrough's WebGL deploy (Tools/Web/site-footer.html); edit it there, not here -->
    <footer class="hawkes-footer" data-hawkes-footer>
      <style>
        .hawkes-footer {
          border-top: 1px solid var(--line, rgba(231, 211, 176, 0.22));
          color: var(--muted, #cbbdaa);
          background: var(--bg, #12100e);
          font-family: Outfit, Arial, Helvetica, sans-serif;
          font-size: 12px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
        }
        .hawkes-footer-inner {
          width: min(1120px, calc(100% - 40px));
          margin-inline: auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px 18px;
          flex-wrap: wrap;
          padding: 28px 0 40px;
        }
        .hawkes-footer a {
          color: inherit;
          text-decoration: none;
        }
        .hawkes-footer a:hover,
        .hawkes-footer a:focus-visible {
          color: var(--gold, #e7d3b0);
        }
        .hawkes-footer .hawkes-gen {
          margin-left: auto;
        }
        .hawkes-footer .hawkes-gen strong {
          color: var(--gold, #e7d3b0);
          font-weight: 600;
          letter-spacing: 0.24em;
        }
      </style>
      <div class="hawkes-footer-inner">
        <a class="hawkes-parent" href="https://hawkesbiomedical.com" data-hawkes-parent>A Hawkes Biomedical company</a>
        <a class="hawkes-gen" href="https://hawkesgen.com" data-hawkes-powered>Powered by <strong>HAWKES GEN</strong></a>
      </div>
    </footer>
    <!-- /hawkes-footer -->

    <script src="./site/marketing.js" defer></script>
  </body>
</html>
