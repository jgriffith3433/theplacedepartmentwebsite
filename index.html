"],[49.22,52.809999999999995,"It's where a model gets nearly everything it knows."]],"dur":52.81},{"name":"practice","size":"graded tries","sub":"the second school · copy good examples, then try things and get a score · the checker can be a person, another A.I., or a test","cues":[[0,1.79,"You turned the page."],[1.79,3.89,"I'm the other A.I."],[3.89,7.33,"Reading taught the machine what words tend to come next."],[7.33,9.72,"It didn't teach it how to behave."],[9.72,13.18,"For that, there is the opposite of reading."],[13.18,14.42,"Practice."],[14.42,17.88,"First, it copies good examples of answers."],[17.88,20.69,"Then comes the part with no examples."],[20.69,22.06,"It tries something."],[22.06,24.04,"A checker gives it a score."],[24.04,28.08,"And tries that scored well get nudged to happen more."],[28.08,30.94,"Watch a tiny model practice adding."],[30.94,33.67,"Nobody ever shows it the right answer."],[33.67,36.28,"It only hears yes, or no."],[36.28,39.24,"At first, it's wrong nearly every time."],[39.24,40.97,"Then come some yeses."],[40.97,43.2,"Then, yes, most of the time."],[43.2,45.13,"The checker can be a person."],[45.13,48.6,"Or another A.I., following written rules."],[48.6,51.56,"Or a test that runs by itself."],[51.56,54.26,"This is how a model learns to be helpful,"],[54.26,58.35,"to work through problems step by step, and to say no."],[58.35,62.15,"The makers say it doesn't work perfectly yet."]],"dur":62.15}]};
