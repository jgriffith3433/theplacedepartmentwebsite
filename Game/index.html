  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar" data-stage="downloading">
      <div class="dossier">
        <div class="dossier-head">
          <div class="dossier-kicker">Records</div>
          <span class="dossier-stamp" aria-hidden="true">Dossier</span>
        </div>
        <div class="shift-pick" id="shift-pick" data-shift-pick>
          <p class="shift-pick-label">Choose your shift</p>
          <div class="shift-pick-grid">
            <a class="shift-pick-card" data-shift="campaign" href="?mode=campaign" data-play="load-campaign" aria-label="Campaign: story in six chapters, progress stays filed">
              <img src="../assets/campaign/ch1.jpg" alt="" width="480" height="270" loading="lazy" decoding="async" />
              <strong>Campaign</strong>
              <span class="shift-desc" aria-hidden="true" data-desc="Story in six chapters. Progress stays filed."></span>
              <span class="shift-play">Play</span>
            </a>
            <a class="shift-pick-card" data-shift="arcade" href="?mode=arcade" data-play="load-arcade" aria-label="Arcade: endless Hollow, bosses at waves 10, 20 and 30">
              <img src="../assets/shots/shot-1-640.jpg" alt="" width="640" height="360" loading="lazy" decoding="async" />
              <strong>Arcade</strong>
              <span class="shift-desc" aria-hidden="true" data-desc="Endless Hollow. Bosses at waves 10, 20 and 30."></span>
              <span class="shift-play">Play</span>
            </a>
          </div>
        </div>
        <p id="load-mode" hidden aria-hidden="true"></p>
        <h1 id="load-title">Opening your file</h1>
        <div class="dossier-file" data-file="FILE No. 0000 · CLEARANCE: PENDING" aria-hidden="true"></div>
        <div id="load-working">
          <div id="load-line">Opening your file&hellip;</div>
          <div class="dossier-status">
            <span id="load-stage" role="status" aria-label="Downloading"></span>
            <span id="load-percent" data-pct="0%"></span>
          </div>
          <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading the game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="unity-progress-bar-full"></div></div>
          <div class="dossier-meta">
            <span id="load-bytes" data-bytes="0.0 of ~90 MB"></span>
          </div>
          <div id="load-stall" role="status" aria-live="polite" hidden>
            <span aria-label="Slow connection: taking longer than usual to retrieve this file.">Slow connection</span>
            <button type="button" id="load-stall-retry">Retry</button>
          </div>
        </div>
        <div id="load-error" role="alert">

          <p id="load-message">The file could not be opened. It was not lost: nothing here ever is.</p>
          <p id="load-detail"></p>
          <div class="load-actions">
            <button type="button" id="load-retry">Retry</button>
            <a class="home" href="../">Back home</a>
          </div>
        </div>
      </div>
    </div>
    <div id="missing-build">
      <p>No game build has been published yet.</p>
      <p style="margin-top: 12px;"><a class="home" href="../">Back home</a></p>
    </div>
    <div id="unity-warning"></div>
  </div>
  <button type="button" id="fs-button" hidden aria-label="Enter fullscreen" data-label="Fullscreen"></button>
  <div id="rotate-card" role="dialog" aria-labelledby="rotate-title" hidden>
    <div class="rotate-icon" aria-hidden="true">&#8635;</div>
    <h2 id="rotate-title">Turn sideways</h2>
    <p class="rotate-note" data-note="Turn your phone to landscape and the Department will carry on."></p>
    <button type="button" id="rotate-anyway" aria-label="Play in portrait anyway">Play anyway</button>
  </div>
  <div id="version-display" aria-hidden="false"></div>
  <script>
    var gameVersion = window.PLACE_BUILD;
    // The build every event names: the Game/v<n> folder this page loads (set before the deferred SDK runs).
    window.HAWKES_BUILD = { version: gameVersion };
    var gameName = "PlaceDepartment";
    

    // Shift from the landing (or this card): ?mode=campaign|arcade. The loading card names it; Unity does not
    // read the param yet (note for a breakingthrough task). Preserve other query keys on the pick links.
    (function () {
      var MODES = {
        campaign: {
          label: "Campaign",
          title: "Opening Campaign",
          file: "SHIFT: CAMPAIGN · SIX CHAPTERS",
          line: "Retrieving your case file\u2026"
        },
        arcade: {
          label: "Arcade",
          title: "Opening Arcade",
          file: "SHIFT: ARCADE · ENDLESS HOLLOW",
          line: "Opening the Hollow ledger\u2026"
        }
      };
      var params = new URLSearchParams(location.search);
      var raw = String(params.get("mode") || "").toLowerCase();
      var mode = MODES[raw] ? raw : "";
      window.PLACE_MODE = mode || null;
      var bar = document.getElementById("unity-loading-bar");
      if (bar) {
        if (mode) bar.setAttribute("data-mode", mode);
        else bar.removeAttribute("data-mode");
      }
      var titleEl = document.getElementById("load-title");
      var modeEl = document.getElementById("load-mode");
      var fileEl = document.querySelector(".dossier-file");
      var lineEl = document.getElementById("load-line");
      if (mode && MODES[mode]) {
        var info = MODES[mode];
        if (titleEl) titleEl.textContent = info.title;
        if (modeEl) {
          modeEl.hidden = false;
          modeEl.setAttribute("data-text", "Shift \u00b7 " + info.label);
        }
        if (fileEl) {
          fileEl.setAttribute("data-file", info.file + " \u00b7 FILE No. 0000");
        }
        if (lineEl) lineEl.textContent = info.line;
        document.title = info.label + " — The Place Department";
      }
      document.querySelectorAll("[data-shift-pick] [data-shift]").forEach(function (card) {
        var key = card.getAttribute("data-shift");
        var next = new URL(location.href);
        next.searchParams.set("mode", key);
        card.setAttribute("href", next.pathname + next.search + next.hash);
        card.classList.toggle("is-active", key === mode);
        if (key === mode) card.setAttribute("aria-current", "true");
        else card.removeAttribute("aria-current");
      });
    })();

    if (gameVersion === "v0") {
      document.getElementById("unity-loading-bar").style.display = "none";
      document.getElementById("missing-build").style.display = "block";
    } else {
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.cssText = "background:" + (type === "warning" ? "rgba(255,193,7,0.95)" : "rgba(180,40,40,0.95)") + ";color:#111;padding:10px 14px;margin-top:8px;border-radius:6px;font-family:Arial,sans-serif;";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentElement) div.parentElement.removeChild(div);
          }, 5000);
        }
      }

      // Size the drawing buffer to the canvas's laid-out box at a capped devicePixelRatio (sharp, but light on phones).
      // Event driven only: resize, orientation, visual viewport, tab return and fullscreen changes; no timers.
      function fitCanvas() {
        var box = canvas.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.round(box.width * dpr));
        var h = Math.max(1, Math.round(box.height * dpr));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
      }
      // Browsers settle the new size a frame after an orientation change or a tab return: refit once then too.
      function fitSoon() { fitCanvas(); requestAnimationFrame(fitCanvas); }
      window.addEventListener("resize", fitSoon);
      window.addEventListener("orientationchange", fitSoon);
      window.placeFitCanvas = fitSoon;
      document.addEventListener("fullscreenchange", fitSoon);
      document.addEventListener("webkitfullscreenchange", fitSoon);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) fitSoon(); });
      window.addEventListener("pageshow", fitSoon);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitSoon);
      // Keep the page itself from scrolling or bouncing (iOS ignores overflow:hidden on some gestures).
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      fitCanvas();

      // Dossier loading card: event-driven progress from streaming download + createUnityInstance's callback,
      // MB counter from Content-Length at the Game/build.json base, stage labels (Downloading / Unpacking / Starting),
      // one static line, a >20s slow-connection note with Retry, and stamped error + Retry.
      var FILE_KEYS = ["data", "code", "framework"];
      var APPROX_TOTAL_BYTES = 90 * 1000000;
      var stallMatch = /[?&]stallms=(\d+)\b/.exec(location.search);
      var loadingPlaytest = /[?&]playtest=loading\b/.test(location.search);
      var STALL_MS = stallMatch ? Math.max(250, parseInt(stallMatch[1], 10)) : (loadingPlaytest ? 500 : 20000);

      var STAGE_LABELS = {
        downloading: "Downloading",
        unpacking: "Unpacking",
        starting: "Starting"
      };

      var loadLineEl = document.getElementById("load-line");
      var loadStageEl = document.getElementById("load-stage");
      var loadPercentEl = document.getElementById("load-percent");
      var loadBytesEl = document.getElementById("load-bytes");
      var loadBarEl = document.getElementById("unity-progress-bar-empty");
      var loadStallEl = document.getElementById("load-stall");
      var loadStallRetryBtn = document.getElementById("load-stall-retry");
      var loadRetryBtn = document.getElementById("load-retry");
      (function () {
        var fe = document.querySelector(".dossier-file");
        var n = String(Math.floor(1000 + Math.random() * 9000));
        fe.setAttribute("data-file", fe.getAttribute("data-file").replace("0000", n));
      })();

      var initialHeadUrl = window.HAWKES_BUILD_URL;
      var loadAttempt = 0;
      var hasRetried = false;
      var unityStarted = false;
      var loadFailed = false;
      var currentAbort = null;
      var prefetchBlobs = [];
      var stallTimer = null;

      var shownProgress = 0;
      var loadedBytes = 0;
      var totalBytes = 0;
      var headersKnown = false;
      var currentStage = "downloading";
      var lastStallBytes = 0;
      var lastStallProgress = 0;

      function formatMB(bytes) {
        return (Math.max(0, bytes) / 1000000).toFixed(1);
      }

      function renderCard() {
        if (loadFailed) return;
        var clamped = Math.max(0, Math.min(1, shownProgress));
        var pct = Math.round(100 * clamped);
        var widthPct = (100 * clamped).toFixed(1) + "%";
        if (progressBarFull.style.width !== widthPct) progressBarFull.style.width = widthPct;
        var pctText = pct + "%";
        if (loadPercentEl.getAttribute("data-pct") !== pctText) loadPercentEl.setAttribute("data-pct", pctText);
        loadBarEl.setAttribute("aria-valuenow", String(pct));
        // Buckets for throttled playtest shots (10% / 60% / done) without changing what the player sees.
        var bucket = clamped >= 1 ? "done" : clamped >= 0.6 ? "60" : clamped >= 0.1 ? "10" : "start";
        if (loadingBar.getAttribute("data-progress") !== bucket) {
          loadingBar.setAttribute("data-progress", bucket);
          window.dispatchEvent(new CustomEvent("place-load-bucket", { detail: { bucket: bucket, progress: clamped } }));
        }

        var stageLabel = STAGE_LABELS[currentStage] || "Downloading";
        if (loadStageEl.getAttribute("aria-label") !== stageLabel) loadStageEl.setAttribute("aria-label", stageLabel);
        if (loadingBar.getAttribute("data-stage") !== currentStage) {
          loadingBar.setAttribute("data-stage", currentStage);
        }

        var bytesText;
        if (headersKnown) {
          var shownBytes = Math.min(loadedBytes, totalBytes);
          bytesText = formatMB(shownBytes) + " of " + formatMB(totalBytes) + " MB";
        } else if (currentStage !== "downloading" && loadedBytes > 0) {
          bytesText = formatMB(loadedBytes) + " of " + formatMB(loadedBytes) + " MB";
        } else {
          var approxDenom = loadedBytes >= 85000000
            ? Math.ceil((loadedBytes * 1.15) / 10000000) * 10000000
            : APPROX_TOTAL_BYTES;
          bytesText = formatMB(loadedBytes) + " of ~" + Math.round(approxDenom / 1000000) + " MB";
        }
        if (loadBytesEl.getAttribute("data-bytes") !== bytesText) loadBytesEl.setAttribute("data-bytes", bytesText);
      }

      function setStage(stage) {
        if (loadFailed || window.placeGameReady) return;
        if (currentStage === stage) return;
        currentStage = stage;
        renderCard();
      }

      function hideStall() {
        if (!loadStallEl.hidden) loadStallEl.hidden = true;
        loadingBar.removeAttribute("data-stalled");
      }

      function showStall() {
        if (loadFailed || window.placeGameReady) return;
        loadStallEl.hidden = false;
        loadingBar.setAttribute("data-stalled", "true");
        window.dispatchEvent(new CustomEvent("place-load-stall", { detail: { progress: shownProgress, loadedBytes: loadedBytes, totalBytes: totalBytes } }));
      }

      function resetStallTimer() {
        if (stallTimer) clearTimeout(stallTimer);
        stallTimer = null;
        if (loadFailed || window.placeGameReady) return;
        stallTimer = setTimeout(showStall, STALL_MS);
      }

      function stopTimers() {
        if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
      }

      function recordProgress(progress) {
        if (loadFailed || window.placeGameReady) return;
        var next = Math.max(shownProgress, Math.max(0, Math.min(1, progress)));
        var moved = next > lastStallProgress + 0.0005 || loadedBytes > lastStallBytes;
        shownProgress = next;
        if (moved) {
          lastStallProgress = shownProgress;
          lastStallBytes = loadedBytes;
          hideStall();
          resetStallTimer();
        }
        renderCard();
        window.dispatchEvent(new CustomEvent("place-load-progress", {
          detail: { progress: shownProgress, stage: currentStage, loadedBytes: loadedBytes, totalBytes: totalBytes }
        }));
      }

      function revokeBlobs() {
        for (var i = 0; i < prefetchBlobs.length; i++) {
          try { URL.revokeObjectURL(prefetchBlobs[i]); } catch (e) {}
        }
        prefetchBlobs = [];
      }

      function showLoadError(detail, attempt) {
        if (attempt !== undefined && attempt !== loadAttempt) return;
        if (loadFailed) return;
        loadFailed = true;
        if (currentAbort) {
          try { currentAbort.abort(); } catch (e) {}
          currentAbort = null;
        }
        revokeBlobs();
        stopTimers();
        hideStall();
        loadingBar.hidden = false;
        loadingBar.style.display = "";
        loadingBar.className = "failed";
        loadingBar.setAttribute("data-stage", "error");
        document.getElementById("load-detail").textContent = detail ? String(detail).slice(0, 200) : "";
        if (window.placeAnalytics) window.placeAnalytics("track", ["load_error", { detail: String(detail || "").slice(0, 120) }]);
        try { loadRetryBtn.focus(); } catch (e) {}
      }

      function resolveBuildBase(signal) {
        if (typeof fetch !== "function") {
          var direct = window.HAWKES_BUILD_URL || ((window.HAWKES_BUILD_BASE || "") + gameVersion + "/");
          return Promise.resolve(String(direct).replace(/\/?$/, "/"));
        }
        return fetch("build.json", signal ? { signal: signal } : undefined).then(function (r) {
          return r.ok ? r.json() : null;
        }).catch(function () {
          return null;
        }).then(function (info) {
          var overrideUrl = window.HAWKES_BUILD_URL !== initialHeadUrl ? window.HAWKES_BUILD_URL : null;
          var picked = overrideUrl || (info && info.base) || window.HAWKES_BUILD_URL || ((window.HAWKES_BUILD_BASE || "") + gameVersion + "/");
          return String(picked).replace(/\/?$/, "/");
        });
      }

      var activeLoaderScript = null;
      function loadScriptOnce(src, forceFail) {
        if (!forceFail && typeof window.createUnityInstance === "function") {
          return Promise.resolve();
        }
        if (activeLoaderScript && activeLoaderScript.parentNode) {
          activeLoaderScript.parentNode.removeChild(activeLoaderScript);
          activeLoaderScript = null;
        }
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          activeLoaderScript = s;
          s.src = src;
          s.onload = function () {
            if (activeLoaderScript === s) activeLoaderScript = null;
            resolve();
          };
          s.onerror = function () {
            if (activeLoaderScript === s) activeLoaderScript = null;
            if (s.parentNode) s.parentNode.removeChild(s);
            reject(new Error("Could not load " + src));
          };
          document.body.appendChild(s);
        });
      }

      function startLoad() {
        var attempt = ++loadAttempt;
        if (currentAbort) {
          try { currentAbort.abort(); } catch (e) {}
        }
        currentAbort = typeof AbortController === "function" ? new AbortController() : null;
        var signal = currentAbort ? currentAbort.signal : undefined;
        revokeBlobs();

        loadFailed = false;
        shownProgress = 0;
        loadedBytes = 0;
        totalBytes = 0;
        headersKnown = false;
        currentStage = "downloading";
        lastStallBytes = 0;
        lastStallProgress = 0;

        loadingBar.hidden = false;
        loadingBar.style.display = "";
        loadingBar.className = "";
        hideStall();
        renderCard();
        resetStallTimer();

        // Named playtest shortcuts: ?loadfail=1 simulates a failed fetch; ?stall=1 simulates a stalled transfer.
        // Both clear on Retry (hasRetried) so Retry can recover and finish loading.
        var forceFail = !hasRetried && /[?&]loadfail=1\b/.test(location.search);
        var forceStall = !hasRetried && (loadingPlaytest || /[?&]stall=1\b/.test(location.search));

        if (window.placeAnalytics && attempt === 1) window.placeAnalytics("loadStart", []);

        resolveBuildBase(signal).then(function (buildBase) {
          if (attempt !== loadAttempt) return;
          if (forceStall) {
            // Hold open with no byte progress so the >20s stall watchdog fires cleanly; Retry aborts and proceeds.
            return new Promise(function () {});
          }

          var buildUrl = buildBase + gameName + "/Build/" + gameName;
          var config = {
            arguments: [],
            dataUrl: buildUrl + ".data.unityweb?v=" + gameVersion,
            frameworkUrl: buildUrl + ".framework.js.unityweb?v=" + gameVersion,
            codeUrl: buildUrl + ".wasm.unityweb?v=" + gameVersion,
            streamingAssetsUrl: buildBase + gameName + "/StreamingAssets",
            companyName: "The Place Department",
            productName: "PlaceDepartment",
            productVersion: gameVersion,
            showBanner: unityShowBanner,
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          };

          var rawUrls = {
            data: config.dataUrl,
            code: config.codeUrl,
            framework: config.frameworkUrl
          };
          var fileState = {
            data: { headerDone: false, loaded: 0, total: 0, done: false, blobbed: false },
            code: { headerDone: false, loaded: 0, total: 0, done: false, blobbed: false },
            framework: { headerDone: false, loaded: 0, total: 0, done: false, blobbed: false }
          };

          function syncStreamProgress() {
            if (attempt !== loadAttempt || loadFailed || window.placeGameReady) return;
            var sumLoaded = 0, sumTotal = 0, allPositiveTotals = true, allDone = true;
            for (var i = 0; i < FILE_KEYS.length; i++) {
              var st = fileState[FILE_KEYS[i]];
              sumLoaded += st.loaded;
              sumTotal += st.total;
              if (!st.headerDone || st.total <= 0) allPositiveTotals = false;
              if (!st.done) allDone = false;
            }
            loadedBytes = Math.max(loadedBytes, sumLoaded);
            // Require a positive Content-Length on all three files so a small file (framework.js ~95 KB)
            // never divides by its own size alone when data.unityweb is pending or lacks Content-Length.
            if (allPositiveTotals && sumTotal > 0) {
              totalBytes = sumTotal;
              headersKnown = true;
            }
            var ratio;
            if (headersKnown) {
              ratio = Math.min(1, loadedBytes / totalBytes);
            } else {
              // Smooth asymptotic curve when Content-Length is absent so the bar never freezes or jumps.
              ratio = loadedBytes / (loadedBytes + 45000000);
            }
            if (allDone) {
              setStage("unpacking");
              recordProgress(0.84);
            } else {
              setStage("downloading");
              recordProgress(0.82 * ratio);
            }
          }

          // Measure Content-Length via HEAD on original HTTP URLs when native DecompressionStream prefetch isn't used.
          function measureHeadsFallback() {
            if (typeof fetch !== "function" || headersKnown) return;
            FILE_KEYS.forEach(function (key) {
              if (fileState[key].headerDone && fileState[key].total > 0) return;
              var targetUrl = rawUrls[key];
              if (!targetUrl || /^blob:/i.test(targetUrl)) return;
              fetch(targetUrl, { method: "HEAD", mode: "cors", signal: signal }).then(function (res) {
                if (attempt !== loadAttempt || loadFailed || window.placeGameReady) return;
                fileState[key].total = parseInt(res.headers.get("Content-Length"), 10) || 0;
                fileState[key].headerDone = true;
                var sum = 0, allPositive = true;
                for (var i = 0; i < FILE_KEYS.length; i++) {
                  var st = fileState[FILE_KEYS[i]];
                  sum += st.total;
                  if (!st.headerDone || st.total <= 0) allPositive = false;
                }
                if (allPositive && sum > 0) {
                  totalBytes = sum;
                  headersKnown = true;
                  if (currentStage === "downloading") {
                    loadedBytes = Math.max(loadedBytes, Math.round(Math.min(1, shownProgress / 0.9) * totalBytes));
                  } else {
                    loadedBytes = totalBytes;
                  }
                  renderCard();
                }
              }).catch(function () {});
            });
          }

          // The build files are gzip ("UnityWeb Compressed Content") served as application/octet-stream with no
          // Content-Encoding. Downloading all three in parallel and piping through native DecompressionStream
          // avoids Unity's ~53 s JS inflate while streaming exact network byte counts from Content-Length.
          var canStreamUnzip = typeof DecompressionStream === "function" && typeof fetch === "function" && !forceFail;
          function prefetchPlain(key, url) {
            if (!canStreamUnzip) return Promise.resolve(url);
            var gotResponse = false;
            return fetch(url, { mode: "cors", signal: signal }).then(function (res) {
              if (!res.ok || !res.body) throw new Error("HTTP " + res.status + " for " + key);
              gotResponse = true;
              fileState[key].total = parseInt(res.headers.get("Content-Length"), 10) || 0;
              fileState[key].headerDone = true;
              syncStreamProgress();
              var reader = res.body.getReader();
              return reader.read().then(function (first) {
                var gz = !first.done && first.value && first.value.length > 2 && first.value[0] === 0x1f && first.value[1] === 0x8b;
                var pending = first;
                var bytes = new ReadableStream({
                  pull: function (controller) {
                    var step = pending ? Promise.resolve(pending) : reader.read();
                    pending = null;
                    return step.then(function (r) {
                      if (attempt !== loadAttempt || loadFailed) { controller.close(); return; }
                      if (r.done) {
                        fileState[key].done = true;
                        syncStreamProgress();
                        controller.close();
                        return;
                      }
                      fileState[key].loaded += r.value.length;
                      syncStreamProgress();
                      controller.enqueue(r.value);
                    });
                  },
                  cancel: function (why) { return reader.cancel(why); }
                });
                var out = gz ? bytes.pipeThrough(new DecompressionStream("gzip")) : bytes;
                return new Response(out).blob();
              });
            }).then(function (blob) {
              if (attempt !== loadAttempt || loadFailed) return url;
              fileState[key].done = true;
              fileState[key].blobbed = true;
              syncStreamProgress();
              var blobUrl = URL.createObjectURL(blob);
              prefetchBlobs.push(blobUrl);
              return blobUrl;
            }, function (err) {
              if (signal && signal.aborted) throw err;
              // Propagate network/CORS/HTTP failures before unityStarted so #load-error + in-page Retry handle them.
              if (!gotResponse) throw err;
              return url; // mid-stream DecompressionStream issue: fall back to Unity's own unpacker
            });
          }

          if (!canStreamUnzip && !forceFail) {
            measureHeadsFallback();
          }

          var loaderSrc = forceFail
            ? buildBase + "loadfail-missing.js"
            : buildUrl + ".loader.js?v=" + gameVersion + (attempt > 1 ? "&r=" + attempt : "");
          var prefetchPromise = forceFail
            ? Promise.resolve(null)
            : Promise.all([
                prefetchPlain("data", config.dataUrl),
                prefetchPlain("code", config.codeUrl),
                prefetchPlain("framework", config.frameworkUrl)
              ]);

          return Promise.all([loadScriptOnce(loaderSrc, forceFail), prefetchPromise]).then(function (res) {
            if (attempt !== loadAttempt || loadFailed) return;
            var urls = res[1];
            var allPrefetched = false;
            if (urls) {
              config.dataUrl = urls[0];
              config.codeUrl = urls[1];
              config.frameworkUrl = urls[2];
              allPrefetched = fileState.data.blobbed && fileState.code.blobbed && fileState.framework.blobbed;
            }
            if (!allPrefetched) {
              measureHeadsFallback();
            } else {
              setStage("unpacking");
              recordProgress(0.84);
            }

            unityStarted = true;
            return createUnityInstance(canvas, config, function (unityProgress) {
              if (attempt !== loadAttempt || loadFailed) return;
              var u = Math.max(0, Math.min(1, Number(unityProgress) || 0));
              if (allPrefetched) {
                if (headersKnown) loadedBytes = totalBytes;
                if (u < 0.9) {
                  setStage("unpacking");
                  recordProgress(0.84 + (u / 0.9) * 0.10);
                } else if (u < 1) {
                  setStage("starting");
                  recordProgress(0.96);
                } else {
                  setStage("starting");
                  recordProgress(1);
                }
              } else {
                var baseBytes = headersKnown ? totalBytes : APPROX_TOTAL_BYTES;
                if (u < 0.895) {
                  setStage("downloading");
                  loadedBytes = Math.max(loadedBytes, Math.round(Math.min(1, u / 0.9) * baseBytes));
                  recordProgress(u);
                } else if (u < 1) {
                  loadedBytes = Math.max(loadedBytes, baseBytes);
                  setStage(u >= 0.95 ? "starting" : "unpacking");
                  recordProgress(Math.max(0.9, u));
                } else {
                  loadedBytes = Math.max(loadedBytes, baseBytes);
                  setStage("starting");
                  recordProgress(1);
                }
              }
            });
          }).then(function (instance) {
            if (attempt !== loadAttempt || loadFailed || !instance) return;
            window.placeUnity = instance;
            loadedBytes = Math.max(loadedBytes, headersKnown ? totalBytes : APPROX_TOTAL_BYTES);
            setStage("starting");
            recordProgress(1);
            stopTimers();
            hideStall();
            window.placeGameReady = true;
            document.body.classList.add("game-loaded");
            loadingBar.setAttribute("data-stage", "done");
            loadingBar.hidden = true;
            loadingBar.style.display = "none";
            window.dispatchEvent(new Event("placegameready"));
            var tapPrompt = document.getElementById("hawkes-tap");
            if (tapPrompt) {
              try { tapPrompt.focus(); } catch (e) {}
            }
            revokeBlobs();
          });
        }).catch(function (err) {
          if (attempt !== loadAttempt) return;
          if (signal && signal.aborted) return;
          showLoadError(err && err.message ? err.message : err, attempt);
        });
      }

      function retryLoad() {
        hasRetried = true;
        if (unityStarted) {
          // Once createUnityInstance has bound to #unity-canvas, only a fresh navigation can restart cleanly.
          var clean = location.href;
          try {
            var parsed = new URL(location.href);
            parsed.searchParams.delete("loadfail");
            parsed.searchParams.delete("stall");
            parsed.searchParams.delete("stallms");

  <script>
    // Phone controls (static, event driven: no timers or polling). Fullscreen sits on the Tap to play card, in its
    // top-right corner (where the browser has it; iPhone Safari has none for pages). Once play begins the page draws
    // nothing over the canvas (body.game-playing). In portrait, until the player chooses to stay, a full-screen
    // pause card asks for landscape; there is no banner over a running game.
    (function () {
      var root = document.documentElement;
      var fsButton = document.getElementById("fs-button");
      var card = document.getElementById("rotate-card");
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      var supported = !!request && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
      var chosen = false, paused = false;
      var portraitPhone = window.matchMedia("(orientation: portrait) and (max-width: 820px)");

      function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function tapShowing() { return !!document.getElementById("hawkes-tap"); }
      function isPlaying() { return !!window.placeGameReady && !tapShowing(); }

      function setPaused(on) {
        if (on === paused) return;
        paused = on;
        try {
          var m = window.placeUnity && window.placeUnity.Module;
          if (m) { if (on && m.pauseMainLoop) m.pauseMainLoop(); else if (!on && m.resumeMainLoop) m.resumeMainLoop(); }
        } catch (e) {}

      function syncFs() {
        fsButton.hidden = !supported || !window.placeGameReady || !tapShowing();
        var on = !!fsElement();
        fsButton.setAttribute("data-label", on ? "Exit fullscreen" : "Fullscreen");
        fsButton.setAttribute("aria-label", on ? "Exit fullscreen" : "Enter fullscreen");
      }
      fsButton.addEventListener("click", function () {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        try {
          var p = fsElement() ? exit.call(document) : request.call(root);
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      });
      document.addEventListener("fullscreenchange", syncFs);
      document.addEventListener("webkitfullscreenchange", syncFs);

      function syncHint() {
        var playing = isPlaying();
        document.body.classList.toggle("game-playing", playing);
        syncFs();
        var showCard = playing && portraitPhone.matches && !chosen;
        card.hidden = !showCard;
        setPaused(showCard);

      }
      document.getElementById("rotate-anyway").addEventListener("click", function () {
        chosen = true;
        syncHint();
      });

        var origTap = window.hawkesSound.tap;

          syncHint();
          return res;
        };

      window.addEventListener("pointerup", syncHint);
      window.addEventListener("touchend", syncHint, { passive: true });
      window.addEventListener("click", syncHint);
      window.addEventListener("placegameready", syncHint);
      window.addEventListener("orientationchange", syncHint);
      window.addEventListener("resize", syncHint);
      if (portraitPhone.addEventListener) portraitPhone.addEventListener("change", syncHint);
      else portraitPhone.addListener(syncHint);
      syncHint();
    })();
  </script>

<script>
  // Minimal playtest contract for the branded loading card (this site has no Unity bridge contract).
  // Scenarios: smoke (reach Tap to play), loading (stall Retry + 10%/60%/done progress with MB + stage).
  (function () {
    if (window.hawkesPlaytest) return;
    var run = null;
    var stallSeconds = 120;
    function now() { return run ? (performance.now() - run.t0) / 1000 : 0; }
    function round(n) { return Math.round(n * 10) / 10; }
    function t() {
      return {
        scene: function (name) { if (run && run.state.scene !== name) { run.state.scene = name; this.event("scene", name); } },
        progress: function (p) { if (run) { run.state.progress = Math.max(0, Math.min(1, p)); run.moved = performance.now(); } },
        note: function (text) { if (run) run.state.note = String(text); },
        metric: function (name, value) { if (run) run.metrics[name] = value; },
        event: function (type, detail) {
          if (!run) return;
          run.events.push({ t: round(now()), type: type, detail: detail === undefined ? undefined : String(detail) });
          if (run.events.length > 2000) run.events.splice(0, run.events.length - 2000);
          run.moved = performance.now();

        problem: function (severity, message) {
          if (!run) return;

          run.problems.push({ severity: severity, message: String(message) });
          this.event("problem", severity + ": " + message);
        },
        log: function (line) { if (run) { run.log.push(round(now()) + "s " + line); if (run.log.length > 200) run.log.shift(); } },
        finish: function (outcome) {

        wait: function (ms) {

          });

        until: function (test, timeoutMs, what) {

              setTimeout(tick, 50);
            }
            tick();
          });
        },
        get at() { var a = run && run.options && run.options.at; return a == null || a === "" ? null : String(a); }
      };

    function cardClean() {
      var bar = document.getElementById("unity-loading-bar");
      var dossier = document.querySelector(".dossier");
      if (!bar || !dossier || bar.hidden) return true;
      var vb = { w: window.innerWidth || 0, h: window.innerHeight || 0 };
      var box = dossier.getBoundingClientRect();
      if (box.width > vb.w + 1 || box.height > vb.h + 1) return false;
      if (box.left < -1 || box.top < -1) return false;
      // The bar and the MB count must be on screen without scrolling the card.
      var barEl = document.getElementById("unity-progress-bar-empty");
      var mbEl = document.getElementById("load-bytes");
      if (barEl && barEl.getBoundingClientRect().bottom > vb.h) return false;
      if (mbEl && mbEl.getBoundingClientRect().bottom > vb.h) return false;
      var stall = document.getElementById("load-stall");
      var retry = document.getElementById("load-stall-retry");
      if (stall && !stall.hidden && retry) {
        if (stall.getBoundingClientRect().bottom > vb.h) return false;
        var s = stall.getBoundingClientRect();
        var r = retry.getBoundingClientRect();
        if (r.bottom > s.bottom + 2 || r.right > s.right + 2) return false;

    }
    function realClick(el) {
      if (!el) return;

      try {
        el.dispatchEvent(new PointerEvent("pointerdown", opts));
        el.dispatchEvent(new PointerEvent("pointerup", opts));
      } catch (e) {}
      el.dispatchEvent(new MouseEvent("click", opts));
    }
    function bucketOf() {
      return (document.getElementById("unity-loading-bar") || {}).getAttribute("data-progress") || "start";
    }
    function bytesText() {
      return (document.getElementById("load-bytes") || document.body).getAttribute("data-bytes") || "";

    function stageText() {
      return (document.getElementById("load-stage") || {}).getAttribute("aria-label") || "";
    }
    async function playLoading(tr) {
      tr.scene("LoadingCard");
      // Arm a short stall so the slow-connection note + Retry are visible, then continue a real download.
      if (!/[?&]stall=1\b/.test(location.search) && !/[?&]playtest=loading\b/.test(location.search)) {
        try { sessionStorage.setItem("place-pt-loading", "1"); } catch (e) {}
        var u = new URL(location.href);
        u.searchParams.set("playtest", "loading");
        u.searchParams.set("stall", "1");
        u.searchParams.set("stallms", "500");
        location.replace(u.toString());
        return new Promise(function () {});
      }
      tr.note("waiting for slow-connection note");
      await tr.until(function () {
        var el = document.getElementById("load-stall");
        return el && !el.hidden;
      }, 15000, "slow-connection note");
      tr.event("load-stalled", bytesText());
      tr.metric("load.stalled", 1);
      if (!cardClean()) tr.problem("polish", "loading card overlaps at stall");
      await tr.wait(1500);
      realClick(document.getElementById("load-stall-retry"));
      tr.event("load-stall-retry");
      tr.progress(0.15);

      await tr.until(function () { return bucketOf() === "10" || bucketOf() === "60" || bucketOf() === "done" || !!window.placeGameReady; }, 180000, "progress past 10%");
      tr.event("load-progress-10", bytesText() + " · " + stageText());
      tr.metric("load.mbShown", parseFloat(bytesText()) || 0);
      tr.progress(0.35);
      if (!/MB/i.test(bytesText())) tr.problem("bug", "MB counter missing on loading card");
      if (!cardClean()) tr.problem("polish", "loading card overlaps near 10%");

      await tr.until(function () { return bucketOf() === "60" || bucketOf() === "done" || !!window.placeGameReady; }, 180000, "progress past 60%");
      tr.event("load-progress-60", bytesText() + " · " + stageText());
      tr.progress(0.7);
      if (!cardClean()) tr.problem("polish", "loading card overlaps near 60%");

      await tr.until(function () { return bucketOf() === "done" || !!window.placeGameReady || document.body.classList.contains("game-loaded"); }, 180000, "load done");
      tr.event("load-progress-done", stageText());
      tr.scene("TapToPlay");
      tr.progress(1);
      if (!cardClean() && !document.getElementById("unity-loading-bar").hidden) {
        tr.problem("polish", "loading card overlaps when done");
      }
      try { sessionStorage.removeItem("place-pt-loading"); } catch (e) {}

    // Every visible page element whose box intersects the Unity canvas (ancestors and the canvas itself excluded).
    function canvasOverlaps() {
      var cv = document.getElementById("unity-canvas");
      if (!cv) return [];
      var c = cv.getBoundingClientRect();
      var out = [];
      Array.prototype.forEach.call(document.body.querySelectorAll("*"), function (el) {
        if (el === cv || el.contains(cv) || cv.contains(el)) return;
        if (/^(SCRIPT|STYLE|LINK|META|NOSCRIPT)$/.test(el.tagName)) return;
        var cs = getComputedStyle(el);
        if (cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity) === 0) return;
        var r = el.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) return;
        if (r.right <= c.left || r.left >= c.right || r.bottom <= c.top || r.top >= c.bottom) return;
        // Children of a visible element are reported through it only when they are the ones drawing (skip empty wrappers).
        out.push(el.id ? "#" + el.id : el.tagName.toLowerCase() + (el.className && typeof el.className === "string" ? "." + el.className.split(" ")[0] : ""));
      });
      return out;
    }
    async function playPhoneLayout(tr) {
      tr.scene("LoadingCard");
      await tr.until(function () { return !!window.placeGameReady && !!document.getElementById("hawkes-tap"); }, 240000, "Tap to play");
      tr.scene("TapToPlay");
      var portrait = window.innerHeight > window.innerWidth;
      var fs = document.getElementById("fs-button");
      tr.metric("layout.portrait", portrait ? 1 : 0);
      // The fullscreen control belongs on the tap card, in a corner, outside the canvas box once play begins.
      if (fs && !fs.hidden) {
        var fb = fs.getBoundingClientRect();
        var corner = fb.top < window.innerHeight * 0.25 && fb.right > window.innerWidth * 0.5;
        tr.event("fullscreen-on-tap-card", Math.round(fb.left) + "," + Math.round(fb.top));
        if (!corner) tr.problem("polish", "fullscreen control is not in a corner of the tap card");
      } else tr.event("fullscreen-unavailable", "no browser fullscreen here");
      realClick(document.getElementById("hawkes-tap"));
      tr.event("tapped-to-play");
      await tr.until(function () { return !document.getElementById("hawkes-tap"); }, 5000, "tap card gone");
      await tr.wait(400);
      var card = document.getElementById("rotate-card");
      if (portrait) {
        if (!card || card.hidden) tr.problem("bug", "portrait: no full-screen pause card after Tap to play");
        else {
          var cb = card.getBoundingClientRect();
          if (cb.width < window.innerWidth - 1 || cb.height < window.innerHeight - 1) tr.problem("bug", "rotate card is not full-screen");
          tr.event("portrait-pause-card", "full-screen");
        }
        if (document.getElementById("rotate-hint")) tr.problem("bug", "rotate hint banner still exists");
        realClick(document.getElementById("rotate-anyway"));
        tr.event("stay-in-portrait");
        await tr.wait(400);
      } else if (card && !card.hidden) tr.problem("bug", "rotate card shown in landscape");
      var hits = canvasOverlaps();
      tr.metric("layout.canvasOverlaps", hits.length);
      tr.event("canvas-overlaps", hits.length + (hits.length ? ": " + hits.join(", ") : ""));
      if (hits.length) tr.problem("bug", "page elements over the running canvas: " + hits.join(", "));
      // The HUD top (wave counter, Slice bar) is the canvas's top strip: nothing but the canvas may be hit there.
      var cv = document.getElementById("unity-canvas").getBoundingClientRect();
      [0.1, 0.5, 0.9].forEach(function (f) {
        var el = document.elementFromPoint(cv.left + cv.width * f, cv.top + Math.min(40, cv.height * 0.05));
        if (el && el.id !== "unity-canvas") tr.problem("bug", "HUD top covered by " + (el.id || el.tagName));
      });
      var box = { w: Math.round(cv.width), h: Math.round(cv.height), vw: window.innerWidth, vh: window.innerHeight };
      tr.event("canvas-box", JSON.stringify(box));
      if (cv.width < window.innerWidth * 0.9 || cv.height < window.innerHeight * 0.9) tr.problem("polish", "canvas does not fill the safe area");

      tr.finish("done");
    }
    async function playSmoke(tr) {
      tr.scene("LoadingCard");
      await tr.until(function () { return !!window.placeGameReady || document.body.classList.contains("game-loaded"); }, 240000, "game loaded");
      tr.event("game-loaded");
      tr.scene("TapToPlay");
      tr.progress(1);
      tr.finish("done");
    }
    async function playChooseShift(tr) {
      var SHIFT_KEY = "placeChooseShift";
      var phase = "campaign";
      try { phase = sessionStorage.getItem(SHIFT_KEY) || "campaign"; } catch (e) {}
      tr.scene("LoadingCard");
      await tr.wait(80);

      if (!pick) tr.problem("bug", "Choose your shift block missing on loading card");
      else tr.event("shift-pick", "present");

      var title = (document.getElementById("load-title") || {}).textContent || "";
      var modeLine = (document.getElementById("load-mode") || {}).getAttribute("data-text") || "";
      var fileLine = (document.querySelector(".dossier-file") || {}).getAttribute("data-file") || "";

    var scenarios = [
      { id: "smoke", title: "Load the Game page through to Tap to play", seconds: 180, tags: ["smoke"] },
      { id: "loading", title: "Honest loading card: stall Retry, MB, 10/60/done", seconds: 240, tags: ["full"] },
      { id: "phone-layout", title: "Phone: after Tap to play nothing from the page covers the canvas (lists overlaps)", seconds: 240, tags: ["full", "phone"] },
      { id: "choose-shift", title: "Loading card names Campaign then Arcade from shift picks", seconds: 90, tags: ["full", "site"] }
    ];
    var api = {
      version: 1,
      product: "theplacedepartment",
      scenarios: function () { return scenarios.map(function (s) { return Object.assign({}, s); }); },
      start: function (id, options) {

        return Promise.resolve(play).then(function () {
          if (mine === run && !mine.done) tr.finish("done");
        }, function (err) {
          if (mine !== run || mine.done) return;
          tr.problem("bug", "bot error: " + (err && err.message ? err.message : err));

      state: function () {

          t().finish("stuck");

        return Object.assign({}, run.state, { ready: true, metrics: Object.assign({}, run.metrics) });
      },
      report: function () {
        if (!run) return null;
        return {
          scenario: run.id,
          outcome: run.done ? run.state.status : "stuck",
          seconds: round(run.seconds != null ? run.seconds : now()),
          metrics: Object.assign({}, run.metrics),
          events: run.events.slice(),
          problems: run.problems.slice(),
          log: run.log.slice()
        };
      }
    };
    window.hawkesPlaytest = api;
    var q = new URLSearchParams(location.search);
    var auto = q.get("playtest");
    if (auto) {
      var go = function () { api.start(auto, { seed: Number(q.get("seed") || 1) || 1, speed: Number(q.get("speed") || 1) || 1, at: q.get("at") || undefined }); };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(go, 0); });
      else setTimeout(go, 0);
    }
  })();
