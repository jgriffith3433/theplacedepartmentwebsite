<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.HAWKES_BUILD_URL = "https://sites.hawkesgen.ai/builds/o/j-studio-4f12/place-department-unity/b/web/22/";</script>
  <script>window.HAWKES_BUILD_BASE = "https://sites.hawkesgen.ai/builds/placedept/";</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>The Place Department</title>
  <!-- Hawkes Analytics (Gen's SDK). The game's Unity bridge finds this tag (data-hawkes-analytics) and uses it rather
       than loading the SDK a second time. -->
  <script src="https://hawkesgen.ai/sdk/analytics@1.js" data-product="theplacedepartment" data-hawkes-analytics="page" defer></script>
  <script src="../site/analytics.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }
    #unity-container { width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #111; }
    #unity-loading-bar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 3;
      background: radial-gradient(ellipse at 50% 40%, #1c1814 0%, #12100e 70%);
      color: #f6f1e8;
      font-family: Outfit, Arial, Helvetica, sans-serif;
    }
    #unity-loading-bar[hidden] { display: none; }
    .dossier {
      width: min(440px, 100%);
      padding: 26px 28px 22px;
      background: #1c1814;
      border: 1px solid rgba(231, 211, 176, 0.22);
      border-top: 6px solid #e7d3b0;
      border-radius: 4px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    .dossier-kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #cbbdaa;
    }
    .dossier h1 {
      margin: 6px 0 2px;
      font: 600 28px/1.15 Fraunces, Georgia, serif;
      color: #f6f1e8;
    }
    .dossier-file {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #e7d3b0;
      border-bottom: 1px dashed rgba(231, 211, 176, 0.3);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    #load-line {
      min-height: 3em;
      font: italic 16px/1.5 Fraunces, Georgia, serif;
      color: #efe2cc;
    }
    #unity-progress-bar-empty {
      height: 10px;
      margin: 14px 0 8px;
      background: rgba(231, 211, 176, 0.14);
      border: 1px solid rgba(231, 211, 176, 0.22);
      border-radius: 2px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #f0b36a;
      transition: width 0.25s ease-out;
    }
    .dossier-status {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #cbbdaa;
    }
    #load-percent { color: #e7d3b0; font-variant-numeric: tabular-nums; }
    #load-error { display: none; }
    #unity-loading-bar.failed #load-working { display: none; }
    #unity-loading-bar.failed #load-error { display: block; }
    #unity-loading-bar.failed .dossier { border-top-color: #b54a3c; }
    .stamp {
      display: inline-block;
      transform: rotate(-3deg);
      border: 2px solid #d9695a;
      color: #d9695a;
      padding: 2px 10px;
      font: 700 14px/1.4 Outfit, Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    #load-error p { margin: 12px 0 0; line-height: 1.5; color: #efe2cc; }
    #load-detail {
      font-size: 12px;
      color: #cbbdaa;
      word-break: break-all;
      max-height: 4.5em;
      overflow: hidden;
    }
    .load-actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
    #load-retry {
      cursor: pointer;
      border: 0;
      border-radius: 3px;
      padding: 10px 22px;
      background: #f0b36a;
      color: #12100e;
      font: 700 14px/1 Outfit, Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #load-retry:hover, #load-retry:focus-visible { background: #f6c58c; outline: 2px solid #e7d3b0; outline-offset: 2px; }
    #unity-warning {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      max-width: 90%;
      z-index: 4;
    }
    #version-display {
      position: absolute;
      right: 12px;
      bottom: 8px;
      color: rgba(255, 255, 255, 0.55);
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
    #missing-build {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      max-width: 520px;
      line-height: 1.5;
    }
    a.home {
      color: #8fd9b4;
    }
  </style>
  <script>
    // The build number this page plays, from the address Studio points it at (.../b/web/<n>/): it names the build in the
    // corner and in analytics, and busts the cache per build (a fixed "v1" kept every build under one cache key).
    window.PLACE_BUILD = (function (u) { var m = /\/b\/[^\/]+\/(\d+)\/?$/.exec(u || ""); return m ? "v" + m[1] : "v1"; })(window.HAWKES_BUILD_URL);
  </script>
  <script src="hawkes-sound.js?v=v1" data-hawkes-sound></script>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div class="dossier">
        <div class="dossier-kicker">The Place Department &middot; Records</div>
        <h1>Opening your file</h1>
        <div class="dossier-file">FILE No. <span id="load-file">0000</span> &middot; CLEARANCE: PENDING</div>
        <div id="load-working">
          <div id="load-line" aria-live="polite">Retrieving the file from its address&hellip;</div>
          <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading the game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="unity-progress-bar-full"></div></div>
          <div class="dossier-status"><span>Filing in progress</span><span id="load-percent">0%</span></div>
        </div>
        <div id="load-error" role="alert">
          <span class="stamp">File not retrieved</span>
          <p id="load-message">The file could not be opened. It was not lost: nothing here ever is.</p>
          <p id="load-detail"></p>
          <div class="load-actions">
            <button type="button" id="load-retry">Retry</button>
            <a class="home" href="../">Back home</a>
          </div>
        </div>
      </div>
    </div>
    <div id="missing-build">
      <p>No game build has been published yet.</p>
      <p style="margin-top: 12px;"><a class="home" href="../">Back home</a></p>
    </div>
    <div id="unity-warning"></div>
  </div>
  <div id="version-display"></div>
  <script>
    var gameVersion = window.PLACE_BUILD;
    // The build every event names: the Game/v<n> folder this page loads (set before the deferred SDK runs).
    window.HAWKES_BUILD = { version: gameVersion };
    var gameName = "PlaceDepartment";
    document.getElementById("version-display").textContent = gameVersion;

    if (gameVersion === "v0") {
      document.getElementById("unity-loading-bar").style.display = "none";
      document.getElementById("missing-build").style.display = "block";
    } else {
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.cssText = "background:" + (type === "warning" ? "rgba(255,193,7,0.95)" : "rgba(180,40,40,0.95)") + ";color:#111;padding:10px 14px;margin-top:8px;border-radius:6px;font-family:Arial,sans-serif;";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentElement) div.parentElement.removeChild(div);
          }, 5000);
        }
      }

      function fitCanvas() {
        var width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        var height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      // Builds in R2 (hawkesstudio docs/unity-builds-storage.md): the cloud build sets HAWKES_BUILD_BASE; without it, from here.
      // Studio's cloud build (publish.page "site") puts window.HAWKES_BUILD_URL first in <head>: play that build.
      var buildBase = window.HAWKES_BUILD_URL
        ? String(window.HAWKES_BUILD_URL).replace(/\/?$/, "/")
        : (window.HAWKES_BUILD_BASE || "") + gameVersion + "/";
      var buildUrl = buildBase + gameName + "/Build/" + gameName;
      var config = {
        arguments: [],
        dataUrl: buildUrl + ".data.unityweb?v=" + gameVersion,
        frameworkUrl: buildUrl + ".framework.js.unityweb?v=" + gameVersion,
        codeUrl: buildUrl + ".wasm.unityweb?v=" + gameVersion,
        streamingAssetsUrl: buildBase + gameName + "/StreamingAssets",
        companyName: "The Place Department",
        productName: "PlaceDepartment",
        productVersion: gameVersion,
        showBanner: unityShowBanner,
      };

      // The build files are gzip ("UnityWeb Compressed Content") but the build host serves them as application/octet-stream
      // with no Content-Encoding, so the browser can't decode them. Left alone, Unity unzips ~98 MB in JavaScript (a slow
      // load: about 53 s on a cold run). So the page downloads all three in parallel (the data file is the long pole),
      // unzips them with the browser's native DecompressionStream, and hands Unity plain blob: URLs it reads as-is.
      // Anything that is not gzip (a host that starts sending Content-Encoding, so the browser already unzipped it) is
      // passed through unchanged, and without DecompressionStream the original URL goes to Unity (its own slow path).
      var prefetchLoaded = {}, prefetchTotal = {}, prefetchBlobs = [];
      var prefetchProgress = function () {};
      function reportPrefetch() {
        var l = 0, t = 0;
        for (var k in prefetchTotal) { l += prefetchLoaded[k] || 0; t += prefetchTotal[k]; }
        if (t > 0) prefetchProgress(0.85 * Math.min(1, l / t));
      }
      function prefetchPlain(key, url) {
        if (typeof DecompressionStream !== "function" || typeof fetch !== "function" || /[?&]loadfail=1\b/.test(location.search)) return Promise.resolve(url);
        prefetchLoaded[key] = 0;
        return fetch(url, { mode: "cors" }).then(function (res) {
          if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
          prefetchTotal[key] = parseInt(res.headers.get("Content-Length"), 10) || 0;
          var reader = res.body.getReader();
          return reader.read().then(function (first) {
            var gz = !first.done && first.value.length > 2 && first.value[0] === 0x1f && first.value[1] === 0x8b;
            var pending = first;
            var bytes = new ReadableStream({
              pull: function (controller) {
                var step = pending ? Promise.resolve(pending) : reader.read();
                pending = null;
                return step.then(function (r) {
                  if (r.done) { controller.close(); return; }
                  prefetchLoaded[key] += r.value.length;
                  reportPrefetch();
                  controller.enqueue(r.value);
                });
              },
              cancel: function (why) { return reader.cancel(why); }
            });
            var out = gz ? bytes.pipeThrough(new DecompressionStream("gzip")) : bytes;
            return new Response(out).blob();
          });
        }).then(function (blob) {
          var blobUrl = URL.createObjectURL(blob);
          prefetchBlobs.push(blobUrl);
          return blobUrl;
        }, function () {
          return url; // could not prefetch: let Unity fetch (and unzip) it itself
        });
      }
      var prefetch = Promise.all([
        prefetchPlain("data", config.dataUrl),
        prefetchPlain("code", config.codeUrl),
        prefetchPlain("framework", config.frameworkUrl)
      ]).then(function (urls) {
        config.dataUrl = urls[0];
        config.codeUrl = urls[1];
        config.frameworkUrl = urls[2];
      });

      // Dossier loading screen: progress, a Department line that follows the progress, and on failure a stamped
      // notice with Retry (a reload: a Unity instance can't be started twice on one canvas).
      var loadLines = [
        "Retrieving the file from its address\u2026",
        "Checking that this file should not exist\u2026",
        "Stamping the paperwork in triplicate\u2026",
        "The Department thanks you for your patience. It is not required.",
        "Assigning you a desk. Please do not look at the other desks.",
        "Almost filed. Everything is almost filed."
      ];
      var loadLine = document.getElementById("load-line");
      var loadPercent = document.getElementById("load-percent");
      var loadBar = document.getElementById("unity-progress-bar-empty");
      document.getElementById("load-file").textContent = String(Math.floor(1000 + Math.random() * 9000));
      var shownProgress = 0;
      function showProgress(progress) {
        progress = shownProgress = Math.max(shownProgress, progress);
        var pct = Math.max(0, Math.min(100, Math.round(100 * progress)));
        progressBarFull.style.width = pct + "%";
        loadPercent.textContent = pct + "%";
        loadBar.setAttribute("aria-valuenow", String(pct));
        var line = loadLines[Math.min(loadLines.length - 1, Math.floor(progress * loadLines.length))];
        if (loadLine.textContent !== line) loadLine.textContent = line;
      }
      var loadFailed = false;
      function showLoadError(detail) {
        if (loadFailed) return;
        loadFailed = true;
        loadingBar.hidden = false;
        loadingBar.style.display = "";
        loadingBar.className = "failed";
        document.getElementById("load-detail").textContent = detail ? String(detail).slice(0, 200) : "";
        if (window.placeAnalytics) window.placeAnalytics("track", ["load_error", { detail: String(detail || "").slice(0, 120) }]);
        document.getElementById("load-retry").focus();
      }
      document.getElementById("load-retry").addEventListener("click", function () { location.reload(); });
      // Setup shortcut for playtests: ?loadfail=1 behaves as if the build could not be fetched.
      var forceFail = /[?&]loadfail=1\b/.test(location.search);

      var loader = document.createElement("script");
      loader.src = forceFail ? buildBase + "loadfail-missing.js" : buildUrl + ".loader.js?v=" + gameVersion;
      if (window.placeAnalytics) window.placeAnalytics("loadStart", []);
      prefetchProgress = showProgress;
      loader.onload = function () {
        // Wait for the unzipped files, then start Unity (its own fetches of the blob: URLs are instant).
        prefetch.then(function () {
          return createUnityInstance(canvas, config, showProgress);
        }).then(function (instance) {
          showProgress(1);
          loadingBar.style.display = "none";
          prefetchBlobs.forEach(function (u) { URL.revokeObjectURL(u); });
          prefetchBlobs = [];
        }).catch(function (message) {
          showLoadError(message);
        });
      };
      loader.onerror = function () {
        showLoadError("Could not load " + loader.src);
      };
      document.body.appendChild(loader);
    }
  </script>
<!-- hawkes-whatsnew: written by breakingthrough's WebGL deploy (Tools/Web/whatsnew-game.html); edit it there, not here -->
<style>
  #version-display a {
    color: inherit;
    text-decoration: none;
  }
  #version-display a:hover,
  #version-display a:focus-visible {
    color: #e7d3b0;
  }
</style>
<script src="../js/hawkes-release.js?v=v1" data-releases="../releases.json"></script>
<script>
  // The release (releases.json) and the build running, as a link to What's new: "v1.0.0 · build 8 · What's new".
  // It opens in a new tab, so a tap in the corner never ends a run.
  (function () {
    var box = document.getElementById("version-display");
    if (!box) return;
    var build = String(window.PLACE_BUILD || window.GAME_BUILD || "");
    function show(label) {
      var link = document.createElement("a");
      link.href = "../whatsnew.html";
      link.target = "_blank";
      link.rel = "noopener";
      link.setAttribute("data-hawkes-whatsnew", "");
      link.textContent = label;
      box.textContent = "";
      box.appendChild(link);
    }
    show(build + " · What's new");
    if (window.hawkesRelease) window.hawkesRelease.then(function (r) {
      var top = r && r.releases && r.releases[0];
      if (!top) return;
      var beta = /\.hawkesgen\.ai$/.test(location.hostname) || location.hostname === "localhost" || location.hostname === "127.0.0.1";
      show("v" + top.version + (beta ? " beta" : "") + " · build " + build.replace(/^v/, "") + " · What's new");
    });
  })();
</script>
<!-- /hawkes-whatsnew -->
</body>
</html>
